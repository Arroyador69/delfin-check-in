<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Delfín Check-in · TikTok OAuth</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <style>
    body {
      font-family: "Segoe UI", "Avenir Next", "Trebuchet MS", sans-serif;
      padding: 48px 24px;
      color: #E8EEFF;
      background: linear-gradient(160deg, #071018, #0B1220 50%, #121a2c);
      min-height: 100vh;
      margin: 0;
    }
    h1 { font-size: 1.4rem; margin: 0 0 12px; }
    p { color: #9AA8C7; line-height: 1.45; max-width: 36em; }
    code { color: #c7f3ff; }
  </style>
</head>
<body>
  <h1>Delfín Check-in</h1>
  <p id="msg">Conectando con TikTok…</p>
  <script>
    (function () {
      var q = window.location.search || "";
      var api = "http://127.0.0.1:8765";
      var msg = document.getElementById("msg");
      var socialHost = location.hostname === "social.delfincheckin.com";

      if (!q) {
        window.location.replace(socialHost ? "/tiktok" : api + "/tiktok");
        return;
      }

      fetch(api + "/api/exchange", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: window.location.href })
      }).then(function (res) {
        if (!res.ok) throw new Error("exchange");
        window.location.replace(socialHost ? "/tiktok" : api + "/tiktok");
      }).catch(function () {
        msg.innerHTML =
          "No pude hablar con el Mac (<code>python -m delfin_media tiktok serve</code>)." +
          "<br><br>Copia esta URL y en el Mac ejecuta:<br>" +
          "<code>python -m delfin_media tiktok login --code …</code>";
      });
    })();
  </script>
</body>
</html>
